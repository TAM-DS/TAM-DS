<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Tracy Anne Griffin Manning, AI Architect">
  <rect width="1200" height="280" fill="#14170f"/>
  <rect x="0" y="0" width="8" height="280" fill="#d6f25c"/>
  <text x="48" y="78" fill="#d6f25c" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="14" letter-spacing="4">AI ARCHITECT · AUSTIN</text>
  <text x="48" y="148" fill="#f3efe4" font-family="Georgia, serif" font-size="48">Capability is not authority.</text>
  <text x="48" y="196" fill="#c8c2b4" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="18">Governed agents. Paper execution. Evidence a reviewer can inspect.</text>
  <text x="48" y="242" fill="#e2a35a" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="14" letter-spacing="2">TRACY ANNE GRIFFIN MANNING</text>
